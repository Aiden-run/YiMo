spring:
  sql:
    init:
      mode: always

  application:
    name: YiMo
  # 开启虚拟线程：避免 Thread.sleep(delay) 阻塞 Tomcat 线程池导致长时间运行后越用越慢
  threads:
    virtual:
      enabled: true
  # 限制 Servlet 异步（SSE 流式）请求的挂起时间，防止连接堆积占用线程
  mvc:
    async:
      request-timeout: 60000

  datasource:
    url: jdbc:h2:file:~/.YiMo/data/YiMo
    driver-class-name: org.h2.Driver
    username: sa
    password: YiMo

# 服务器配置
server:
  port: 9091

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true